# Native theme paired with the observatory's paper-and-ink visual system.
[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#255bde"
backgroundColor = "#f4f2eb"
secondaryBackgroundColor = "#eeede5"
textColor = "#141a22"
font = "Segoe UI, Microsoft YaHei UI, Yu Gothic UI, sans-serif"
borderColor = "#d6d8d2"
baseRadius = "3px"
buttonRadius = "3px"
headingFontWeights = [450, 500, 500, 500, 500, 500]
baseFontSize = 16
dataframeHeaderBackgroundColor = "#eeede5"
dataframeBorderColor = "#d6d8d2"
chartCategoricalColors = ["#2357d9", "#d97706", "#087f71", "#884ac7"]

[theme.sidebar]
backgroundColor = "#141a22"
secondaryBackgroundColor = "#202936"
textColor = "#e9edf2"
primaryColor = "#9ab8ff"
borderColor = "#343d49"
