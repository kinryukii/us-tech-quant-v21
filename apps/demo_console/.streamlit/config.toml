# Native widgets match apps/shared_ui/theme.css; validated together.
[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
base = "light"
primaryColor = "#315efb"
backgroundColor = "#f8faff"
secondaryBackgroundColor = "#f0f4fb"
textColor = "#11243a"
font = "Segoe UI, Microsoft YaHei UI, Yu Gothic UI, sans-serif"
borderColor = "#dce5f0"
baseRadius = "12px"
buttonRadius = "12px"
headingFontWeights = [600, 600, 550, 550, 550, 550]
baseFontSize = 16
dataframeHeaderBackgroundColor = "#f0f4fb"
dataframeBorderColor = "#dce5f0"
chartCategoricalColors = ["#2357d9", "#d97706", "#087f71", "#884ac7"]

[theme.sidebar]
backgroundColor = "#131b2a"
secondaryBackgroundColor = "#202936"
textColor = "#e9edf2"
primaryColor = "#9ab8ff"
borderColor = "#343d49"
