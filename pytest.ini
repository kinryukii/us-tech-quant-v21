[pytest]
# Default: reviewed synthetic storage, maintenance, preflight and service checks.
# Lifecycle subprocesses use temporary repositories and synthetic worker inputs.
# Keep exact files: directory discovery can import tests that run real research.
# This is not full-repository coverage. Additional/legacy integration tests remain
# selectable with explicit pytest paths after their data/output scope is reviewed.
testpaths =
    tests/storage/test_storage_paths.py
    tests/storage/test_data_store.py
    tests/storage/test_catalog_integration.py
    tests/storage/test_parquet_manifest.py
    tests/storage/test_shared_price_inputs.py
    scripts/maintenance/test_storage_maintenance_entrypoints.py
    scripts/maintenance/test_anti_bloat_policy_consistency.py
    scripts/maintenance/test_default_test_collection.py
    scripts/maintenance/test_harness_preflight.py
    scripts/v22/test_v22_047_r1d_live_market_account_bridge.py
    scripts/v22/test_v22_047_r1e_windows_service_hardening.py
norecursedirs = _backup* .git .venv .pytest_cache .pytest_tmp*
pythonpath =
    .
    scripts/v21
    scripts/v22
    scripts/research/a2/attribution
    scripts/research/a2/data
    scripts/research/a2/institutional
cache_dir = D:/us-tech-quant-cache/pytest/repository-cache
